name: CI

on:
  workflow_call:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Reject tracked local state and credentials
        shell: bash
        run: |
          set -euo pipefail

          forbidden_files="$(
            git ls-files |
              grep -E '(^|/)(terraform\.tfstate($|\.)|tfplan$|[^/]*\.tfplan$|\.env($|\.)|[^/]*\.(pem|key|p12|pfx)$)' ||
              true
          )"

          if [[ -n "${forbidden_files}" ]]; then
            echo "Forbidden local state or credential files are tracked:"
            echo "${forbidden_files}"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Compile Python sources and notebooks
        run: python -m compileall -q src notebooks

      - name: Run Ruff
        run: ruff check src tests

      - name: Run unit and configuration tests
        run: pytest

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Check Terraform formatting
        working-directory: iac/terraform
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without HCP state
        working-directory: iac/terraform
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        working-directory: iac/terraform
        run: terraform validate -no-color

      - name: Publish CI summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## AeroLakehouse CI"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Result: \`${{ job.status }}\`"
            echo "- Checks: repository hygiene, Python, YAML, unit tests, Terraform"
            echo "- Deployment credentials used: no"
          } >> "${GITHUB_STEP_SUMMARY}"
